<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 12px 20px;
            background: #181818;
            border-bottom: 1px solid #272727;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
        }

        .yt-icon { color: #ff0000; flex-shrink: 0; }

        .layout { display: flex; flex: 1; overflow: hidden; }

        .sidebar {
            width: 220px;
            min-width: 220px;
            background: #141414;
            border-right: 1px solid #272727;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 14px 16px 10px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #555;
            flex-shrink: 0;
        }

        .playlist-list { overflow-y: auto; flex: 1; }

        .playlist-item {
            padding: 9px 16px;
            cursor: pointer;
            border-left: 2px solid transparent;
            transition: background 0.1s;
        }

        .playlist-item:hover { background: #1e1e1e; }

        .playlist-item.active {
            background: #1e1e1e;
            border-left-color: #ff0000;
        }

        .playlist-name {
            font-size: 13px;
            color: #c0c0c0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item.active .playlist-name { color: #fff; }

        .playlist-count { font-size: 11px; color: #444; margin-top: 2px; }

        .content { flex: 1; overflow-y: auto; padding: 24px; }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 10px;
            text-align: center;
        }

        .empty-state svg { width: 52px; height: 52px; opacity: 0.2; }
        .empty-state p { font-size: 14px; color: #444; }
        .empty-state span { font-size: 12px; color: #2e2e2e; }

        .content-title { font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 4px; }
        .content-meta { font-size: 12px; color: #555; margin-bottom: 20px; }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 14px;
        }

        .video-card {
            background: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #242424;
        }

        .video-thumb {
            position: relative;
            aspect-ratio: 16 / 9;
            background: #111;
            cursor: pointer;
            overflow: hidden;
        }

        .video-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.2s;
        }

        .video-thumb:hover img { opacity: 0.75; }

        .play-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .play-btn {
            width: 60px;
            height: 42px;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, transform 0.1s;
        }

        .video-thumb:hover .play-btn {
            background: #ff0000;
            transform: scale(1.08);
        }

        .video-thumb iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-label {
            padding: 8px 12px;
            font-size: 12px;
            color: #777;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #3a3a3a; }
    </style>
</head>
<body>
    <header>
        <svg class="yt-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M21.8 8s-.2-1.4-.8-2c-.8-.8-1.6-.8-2-.9C16.4 5 12 5 12 5s-4.4 0-7 .1c-.4.1-1.2.1-2 .9-.6.6-.8 2-.8 2S2 9.6 2 11.2v1.5c0 1.6.2 3.2.2 3.2s.2 1.4.8 2c.8.8 1.8.8 2.3.9C6.8 19 12 19 12 19s4.4 0 7-.2c.4-.1 1.2-.1 2-.9.6-.6.8-2 .8-2s.2-1.6.2-3.2v-1.5C22 9.6 21.8 8 21.8 8zM9.7 14.5V9l5.4 2.8-5.4 2.7z"/>
        </svg>
        <h1>Playlist Viewer</h1>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">Playlists</div>
            <div class="playlist-list" id="playlist-list"></div>
        </aside>
        <main class="content" id="content">
            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8 12.5v-9l6 4.5-6 4.5z"/>
                </svg>
                <p>Loading playlists…</p>
            </div>
        </main>
    </div>

    <script>
        const playlists = [];
        let activeIndex = -1;

        async function init() {
            try {
                const res = await fetch('/api/playlists');
                const list = await res.json();
                await Promise.all(list.map(loadPlaylist));
                renderSidebar();
                if (playlists.length > 0) selectPlaylist(0);
                else showEmpty('No JSON playlists found in the directory.');
            } catch {
                showEmpty('Could not connect to server. Run: node server.js');
            }
        }

        async function loadPlaylist({ name, file }) {
            try {
                const res = await fetch(`/${encodeURIComponent(file)}`);
                const videos = await res.json();
                if (Array.isArray(videos) && videos.length > 0) {
                    playlists.push({ name, videos });
                }
            } catch {}
        }

        function renderSidebar() {
            document.getElementById('playlist-list').innerHTML = playlists.map((p, i) => `
                <div class="playlist-item ${i === activeIndex ? 'active' : ''}" onclick="selectPlaylist(${i})">
                    <div class="playlist-name">${esc(p.name)}</div>
                    <div class="playlist-count">${p.videos.length} videos</div>
                </div>
            `).join('');
        }

        function selectPlaylist(index) {
            activeIndex = index;
            renderSidebar();
            renderContent();
        }

        function renderContent() {
            const playlist = playlists[activeIndex];
            if (!playlist) return;

            const cards = playlist.videos.map(v => {
                const id = esc(v.id);
                const title = esc(v.title || '');
                const thumb = `https://img.youtube.com/vi/${id}/mqdefault.jpg`;
                return `
                    <div class="video-card">
                        <div class="video-thumb" onclick="playVideo(this, '${id}')">
                            <img src="${thumb}" alt="${title}" loading="lazy"
                                onerror="this.style.opacity='0.2'">
                            <div class="play-overlay">
                                <div class="play-btn">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
                                        <path d="M8 5v14l11-7z"/>
                                    </svg>
                                </div>
                            </div>
                        </div>
                        ${v.title ? `<div class="video-label">${title}</div>` : ''}
                    </div>
                `;
            }).join('');

            document.getElementById('content').innerHTML = `
                <div class="content-title">${esc(playlist.name)}</div>
                <div class="content-meta">${playlist.videos.length} videos</div>
                <div class="video-grid">${cards}</div>
            `;
        }

        function playVideo(thumbEl, videoId) {
            thumbEl.innerHTML = `
                <iframe
                    src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen
                ></iframe>
            `;
        }

        function showEmpty(msg) {
            document.getElementById('content').innerHTML = `
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8 12.5v-9l6 4.5-6 4.5z"/>
                    </svg>
                    <p>${esc(msg)}</p>
                </div>
            `;
        }

        function esc(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        init();
    </script>
</body>
</html>
